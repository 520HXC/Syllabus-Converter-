[project]
name = "syllabus-calendar-api"
version = "0.1.0"
description = "FastAPI backend for the Syllabus Calendar MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14",
  "celery[redis]>=5.4",
  "fastapi>=0.115",
  "httpx>=0.28",
  "icalendar>=6.1",
  "openai>=1.99",
  "pdf2image>=1.17",
  "pillow>=11.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "pyjwt[crypto]>=2.10",
  "pymupdf>=1.25",
  "pytesseract>=0.3.13",
  "python-dateutil>=2.9",
  "python-multipart>=0.0.20",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
